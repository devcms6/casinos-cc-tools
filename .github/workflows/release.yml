# Builds casinos-cc-tools.zip and publishes a GitHub release when a version tag is pushed.
#   git tag v0.2.0 && git push origin v0.2.0
# WordPress sites running the plugin pick the release up through "Check for updates".
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the plugin version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HEADER=$(grep -m1 -E '^\s*\*\s*Version:' casinos-cc-tools.php | sed -E 's/.*Version:\s*//' | tr -d '[:space:]')
          CONST=$(grep -m1 "define( 'CCT_VERSION'" casinos-cc-tools.php | sed -E "s/.*'CCT_VERSION', '([^']+)'.*/\1/")
          echo "tag=$TAG header=$HEADER const=$CONST"
          if [ "$TAG" != "$HEADER" ] || [ "$TAG" != "$CONST" ]; then
            echo "::error::Tag v$TAG does not match Version ($HEADER) and CCT_VERSION ($CONST) in casinos-cc-tools.php"
            exit 1
          fi

      - name: Lint PHP
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Build zip
        run: |
          mkdir -p build/casinos-cc-tools
          rsync -a ./ build/casinos-cc-tools/ --exclude-from=.distignore
          cd build && zip -rq casinos-cc-tools.zip casinos-cc-tools

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/casinos-cc-tools.zip \
            --title "$GITHUB_REF_NAME" --generate-notes
